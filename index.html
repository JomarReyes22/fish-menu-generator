<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087fce">
<link rel="manifest" href="manifest.json">
<title>Fish Menu Generator</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f7fb;color:#17202a}
header{background:#087fce;color:white;padding:20px 16px 18px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:23px}
header p{margin:5px 0 0;font-size:13px;opacity:.9}
main{max-width:680px;margin:auto;padding:12px}
.card{background:white;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #00000012}
h2{font-size:18px;margin:0 0 12px}
label{font-size:13px;font-weight:700;display:block;margin:8px 0 4px}
input,textarea,button{font:inherit}
input,textarea{width:100%;border:1px solid #ccd5dd;border-radius:10px;padding:11px;background:#fff}
textarea{min-height:110px;resize:vertical}
.item{display:grid;grid-template-columns:1.55fr .8fr .75fr 30px;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid #edf0f2}
.item:last-child{border-bottom:0}
.item input{padding:9px}
.avail{width:22px;height:22px}
.remove{width:30px;height:34px;padding:0;border-radius:8px;background:#e74c3c}
button{width:100%;border:0;border-radius:11px;padding:12px;margin-top:8px;font-weight:700;background:#087fce;color:#fff}
button.secondary{background:#4d5963}
button.green{background:#149447}
.photos{display:grid;grid-template-columns:1fr;gap:9px}
.photos img{width:100%;border-radius:11px;display:block}
.preview{white-space:pre-wrap;background:#fbfbfb;border:1px solid #d9e0e6;border-radius:11px;padding:13px;line-height:1.45;font-size:15px}
.note{font-size:12px;color:#64707b;line-height:1.4}
@media(min-width:600px){.photos{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
<h1>🐟 Fish Menu Generator</h1>
<p>Mobile Version 1 • Android + iPhone</p>
</header>
<main>
<section class="card">
<h2>📅 Today's Menu</h2>
<label>Date</label>
<input id="date" type="date" value="2026-08-19">
<label>Opening message</label>
<textarea id="intro">Magandang araw mga Kasuki
Padeliver na po ....

Paninda today   🦐 🐟 🐠 
Fresh fresh fresh 💦💦💦</textarea>
</section>

<section class="card">
<h2>🐟 Fish per Kilo</h2>
<div id="fish"></div>
<button onclick="addFish()">+ Add Fish</button>
</section>

<section class="card">
<h2>🍽️ Plate, Plate, Plate</h2>
<div id="plates"></div>
<button onclick="addPlate()">+ Add Plate Item</button>
</section>

<section class="card">
<h2>🚚 Delivery & Contact</h2>
<textarea id="footer">🟥FREE DELIVERY --- GREENESTATE

🚫MINIMUM 200 - NEARBY SUBDIVISION

🏠 7/25 GREENESTATE PHASE 3 Main Road
☎️ 09350881926

💰We accept GCASH payment

SALAMAT.. ORDER NA PO...

♦️BUSINESS PERMIT♦️
2026 #06319</textarea>
</section>

<section class="card">
<h2>🖼️ Your Pictures</h2>
<div class="photos">
<img src="fish_per_kilo.jpg" alt="Fish per kilo">
<img src="plate_part_1.jpg" alt="Plate items">
<img src="plate_part_2.jpg" alt="Plate items">
</div>
<p class="note">These are the three pictures you provided. Version 1 keeps them ready for your normal Messenger workflow.</p>
</section>

<section class="card">
<button class="green" onclick="generate()">GENERATE TODAY'S MESSAGE</button>
<button onclick="copyMessage()">📋 COPY MESSAGE</button>
<button class="secondary" onclick="downloadTxt()">SAVE MESSAGE</button>
<h2 style="margin-top:18px">Preview</h2>
<div id="preview" class="preview"></div>
</section>
</main>

<script>
const fish=[
{name:"Tahong",price:"110",unit:"kilo",on:true},
{name:"Hipon",price:"520",unit:"kilo",on:true},
{name:"Dalagang Bukid",price:"290",unit:"kilo",on:true},
{name:"Alumahan",price:"290",unit:"kilo",on:true},
{name:"Bangus",price:"280",unit:"kilo",on:true},
{name:"Tilapya",price:"180",unit:"kilo",on:true}
];
const plates=[
["Hipon","120"],["Dalagang Bukid","100"],["Alumahan","100"],
["Bangus 1pc.","180"],["Bangus 2pc.","340"],["Boneless 1pc.","190"],
["Tilapya 2's","100"],["Tilapya 3's","140"]
];

function render(){
 const f=document.getElementById("fish"); f.innerHTML="";
 fish.forEach((x,i)=>{
  f.innerHTML+=`<div class="item">
  <input value="${esc(x.name)}" onchange="fish[${i}].name=this.value">
  <input type="number" value="${esc(x.price)}" onchange="fish[${i}].price=this.value">
  <input value="${esc(x.unit)}" onchange="fish[${i}].unit=this.value">
  <input class="avail" type="checkbox" ${x.on?"checked":""} onchange="fish[${i}].on=this.checked" title="Available">
  <button class="remove" onclick="fish.splice(${i},1);render()">×</button>
  </div>`;
 });
 const p=document.getElementById("plates"); p.innerHTML="";
 plates.forEach((x,i)=>{
  p.innerHTML+=`<div class="item">
  <input value="${esc(x[0])}" onchange="plates[${i}][0]=this.value">
  <input type="number" value="${esc(x[1])}" onchange="plates[${i}][1]=this.value">
  <span style="font-size:12px;color:#667">per plate</span>
  <button class="remove" onclick="plates.splice(${i},1);render()">×</button>
  </div>`;
 });
}
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function addFish(){fish.push({name:"New Fish",price:"0",unit:"kilo",on:true});render()}
function addPlate(){plates.push(["New Item","0"]);render()}
function datePH(){
 const d=new Date(document.getElementById("date").value+"T00:00:00");
 const months=["Enero","Pebrero","Marso","Abril","Mayo","Hunyo","Hulyo","Agosto","Setyembre","Oktubre","Nobyembre","Disyembre"];
 const days=["Linggo","Lunes","Martes","Miyerkules","Huwebes","Biyernes","Sabado"];
 return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()} ${days[d.getDay()]}`;
}
function message(){
 let m=document.getElementById("intro").value.trim()+"\n"+datePH()+"\nFresh fresh fresh 💦💦💦\n\n";
 m= document.getElementById("intro").value.trim()+"\n"+datePH()+"\n\n";
 const available=fish.filter(x=>x.on);
 m+=available.map(x=>`${x.name} ${x.price} ${x.unit}`).join("\n");
 m+="\n\nPLATE, PLATE, PLATE po tayo mga kasuki....\n\n";
 m+=plates.map(x=>`${x[0]} ${x[1]} per plate`).join("\n");
 m+="\n\n"+document.getElementById("footer").value.trim();
 return m;
}
function generate(){document.getElementById("preview").textContent=message()}
async function copyMessage(){
 generate();
 try{await navigator.clipboard.writeText(message());alert("Message copied! Paste it into Messenger.");}
 catch(e){alert("Copy was blocked by the browser. Long-press the preview and copy the text.")}
}
function downloadTxt(){
 const blob=new Blob([message()],{type:"text/plain;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="fish_menu_today.txt";a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
render();generate();
</script>
</body>
</html>
